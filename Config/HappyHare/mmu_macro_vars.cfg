# Fox Feeder MMU - Happy Hare Macro Variables
# User-customizable variables for Fox Feeder operation

[gcode_macro _MMU_SOFTWARE_VARS]
description: Fox Feeder runtime variables
# These variables are managed by Happy Hare but can be customized

variable_user_pre_unload_extension: ""     # Custom macro before unload
variable_user_post_load_extension: ""      # Custom macro after load
variable_user_pre_load_extension: ""       # Custom macro before load
variable_user_post_unload_extension: ""    # Custom macro after unload

# Fox Feeder specific settings
variable_bowden_length: 980                # Measured bowden length (run MEASURE_BOWDEN)
variable_slacker_enabled: True             # Enable Slacker tension sensing
variable_lane_count: 2                     # Number of lanes

# Purge and wipe settings
variable_enable_park: True                 # Park toolhead during changes
variable_park_x: 50                        # Park X position
variable_park_y: 50                        # Park Y position
variable_park_z_hop: 2                     # Z-hop distance

# Purge tower settings (if not using slicer purge)
variable_purge_volume: 100                 # Volume to purge (mm³)
variable_purge_speed: 5                    # Purge speed (mm³/s)

gcode: # Leave empty

[gcode_macro _MMU_SEQUENCE_VARS]
description: Filament load/unload sequence customization
# Override Happy Hare's default sequences if needed

variable_user_sequence_override: False     # Set to True to use custom sequences

# Custom load sequence steps (if override enabled)
# 1 = fast bowden load, 2 = slow extruder feed, 3 = toolhead extrude
variable_load_sequence: [1, 2, 3]

# Custom unload sequence steps (if override enabled)
# 1 = form tip, 2 = retract from extruder, 3 = fast bowden retract
variable_unload_sequence: [1, 2, 3]

gcode: # Leave empty

[gcode_macro _MMU_CALIBRATION_VARS]
description: Fox Feeder calibration data
# Calibration values measured during setup

# Gate-specific calibration (rotation distances)
variable_gate_0_rotation: 22.0             # Lane 0 measured rotation distance
variable_gate_1_rotation: 22.0             # Lane 1 measured rotation distance

# Bowden calibration per gate
variable_gate_0_bowden: 980                # Lane 0 bowden length
variable_gate_1_bowden: 980                # Lane 1 bowden length

# Sensor calibration
variable_gate_0_sensor_offset: 0           # Sensor position offset
variable_gate_1_sensor_offset: 0           # Sensor position offset

gcode: # Leave empty

# ========================
# USER CUSTOMIZATION
# ========================
# Add your custom macros below

[gcode_macro NOZZLE_SCRUB]
description: Scrub the nozzle on a silicone scrubber
gcode:
  {% set scrub_x_start = params.scrub_x_start|default(120)|float %}
  {% set scrub_x_end = params.scrub_x_end|default(90)|float %}
  {% set scrub_y = params.scrub_y|default(5)|float %}
  {% set scrub_speed = params.scrub_speed|default(250)|float %}
  {% set scrub_passes = params.scrub_passes|default(2)|int %}

  G90
  G1 X{scrub_x_start} Y{scrub_y} F{scrub_speed * 60}

  {% for i in range(scrub_passes) %}
    G1 X{scrub_x_end} F{scrub_speed * 60}
    G1 X{scrub_x_start} F{scrub_speed * 60}
  {% endfor %}
  G91
  G1 X-15 F{scrub_speed * 90}
  G90

[gcode_macro GO_TO_PURGE]
description: Move to purge position
gcode:
  {% set purge_x = params.purge_x|default(120)|float %}
  {% set purge_y = params.purge_y|default(5)|float %}
  {% set scrub_speed = params.scrub_speed|default(250)|float %}

  G90
  G1 X{purge_x} Y{purge_y} F{scrub_speed * 60}
