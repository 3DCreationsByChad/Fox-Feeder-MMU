# Fox Feeder MMU - Happy Hare Hardware Configuration
# This config maps Fox Feeder's hardware to Happy Hare's framework
#
# Hardware: 2-lane Fox Feeder with Slacker tension sensor
# MCU: CANbus-based (pcu)
# Design: Individual lane motors (no selector mechanism)

[mmu]
# Happy Hare version check
happy_hare_version: 2  # Requires Happy Hare v2 or later

# Fox Feeder uses a "buffer" style architecture with individual lane motors
# No selector mechanism - Happy Hare will control lane selection via individual steppers
mmu_vendor: FoxFeeder
mmu_version: 1.0
mmu_num_gates: 2  # Number of filament lanes

# Movement speeds and acceleration
gear_from_buffer_speed: 150      # Speed when loading from spool (mm/s)
gear_from_buffer_accel: 150      # Acceleration for buffer moves
gear_from_spool_speed: 60        # Speed when pulling from spool
gear_short_move_speed: 60        # Speed for short movements
gear_homing_speed: 50            # Homing/sensor detection speed

# Fox Feeder bowden configuration
# Measured using MEASURE_BOWDEN macro (currently 980mm)
calibration_bowden_length: 980   # Distance from gate to extruder entrance

# Selector (not used - Fox Feeder has no selector)
# We define minimal selector config to satisfy Happy Hare
selector_max_velocity: 200
selector_max_accel: 600
selector_homing_speed: 60

# Servo (not used on Fox Feeder)
# servo_down_angle: 0  # Disabled
# servo_up_angle: 0    # Disabled

# ========================
# STEPPER CONFIGURATION
# ========================
# Fox Feeder uses individual extruder_steppers per lane
# Happy Hare will control these as gear motors

# GATE 0 (Lane 0) - Primary gear motor
[manual_stepper gear_stepper_0]
step_pin: pcu:lane0_step
dir_pin: pcu:lane0_dir
enable_pin: !pcu:lane0_enable
rotation_distance: 22        # CW2 BMG extruder gears
gear_ratio: 50:10            # CW2 gear ratio
microsteps: 16
full_steps_per_rotation: 200

[tmc2209 manual_stepper gear_stepper_0]
uart_pin: pcu:lane0_uart
run_current: 0.8
hold_current: 0.1
stealthchop_threshold: 0
interpolate: True

# GATE 1 (Lane 1) - Secondary gear motor
[manual_stepper gear_stepper_1]
step_pin: pcu:lane1_step
dir_pin: pcu:lane1_dir
enable_pin: !pcu:lane1_enable
rotation_distance: 22        # CW2 BMG extruder gears
gear_ratio: 50:10            # CW2 gear ratio
microsteps: 16
full_steps_per_rotation: 200

[tmc2209 manual_stepper gear_stepper_1]
uart_pin: pcu:lane1_uart
run_current: 0.8
hold_current: 0.1
stealthchop_threshold: 0
interpolate: True

# Minimal selector definition (Fox Feeder doesn't use a selector)
# This satisfies Happy Hare's requirements but won't be actively used
[manual_stepper mmu_selector]
step_pin: pcu:lane0_step  # Reuse lane0 pin (never activated)
dir_pin: pcu:lane0_dir
enable_pin: !pcu:lane0_enable
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
velocity: 200
accel: 600

# ========================
# SENSOR CONFIGURATION
# ========================
# Fox Feeder uses a unique "Slacker" tension sensing system
# This provides real-time filament state feedback

[mmu_sensors]
# Fox Feeder has individual gate sensors per lane
gate_sensor_0: sensor_0  # Lane 0 filament detection
gate_sensor_1: sensor_1  # Lane 1 filament detection

# Slacker tension sensors (shared across all lanes)
# These detect filament slack/tension in the bowden
pre_gate_switch_pin_0: ^pcu:sensor_0   # Lane 0 entry sensor
pre_gate_switch_pin_1: ^pcu:sensor_1   # Lane 1 entry sensor

# Toolhead sensor using Slacker's "taut" sensor
# This detects when filament reaches the toolhead
toolhead_switch_pin: ^!pcu:taut

# Optional: Extruder entry sensor using "slack" sensor
# Detects when filament enters extruder gears
extruder_switch_pin: ^!pcu:slack

# Encoder/motion sensor (Fox Feeder doesn't use encoders)
# encoder_pin: ^pcu:PA0  # Disabled

# ========================
# GATE MAPPING
# ========================
# Fox Feeder's gate map connects each gate to its stepper

[mmu_gate_map]
# Gate 0 → Lane 0 stepper
gate_0_stepper: gear_stepper_0
gate_0_filament_name: Gate 0

# Gate 1 → Lane 1 stepper
gate_1_stepper: gear_stepper_1
gate_1_filament_name: Gate 1

# Tool to gate mapping (initially 1:1)
# T0 → Gate 0, T1 → Gate 1
tool_to_gate_map: 0, 1
