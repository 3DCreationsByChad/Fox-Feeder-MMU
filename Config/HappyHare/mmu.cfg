# Fox Feeder MMU - Happy Hare Main Configuration
#
# This is the main entry point for Fox Feeder + Happy Hare integration
#
# Installation:
# 1. Install Happy Hare: git clone https://github.com/moggieuk/Happy-Hare.git ~/Happy-Hare
# 2. Run installer: cd ~/Happy-Hare && ./install.sh
# 3. Copy these Fox Feeder configs to ~/printer_data/config/mmu/
# 4. Include this file in your printer.cfg: [include mmu/mmu.cfg]

# ========================
# HAPPY HARE CORE
# ========================
# Load Happy Hare's main software module
[mmu_server]
# Happy Hare software version (managed by Happy Hare)

[mmu]
# Load the Happy Hare Python module
# This provides the core MMU intelligence and UI

# ========================
# HARDWARE CONFIGURATION
# ========================
# Load Fox Feeder hardware definitions
[include mmu_hardware.cfg]

# ========================
# PARAMETERS
# ========================
# Load Fox Feeder operational parameters
[include mmu_parameters.cfg]

# ========================
# MACRO VARIABLES
# ========================
# Load Fox Feeder macro variables
[include mmu_macro_vars.cfg]

# ========================
# MCU CONFIGURATION
# ========================
# Fox Feeder's CAN-bus MCU
[mcu pcu]
canbus_uuid: 2c180b4d19b3

# Pin aliases for easier configuration
[board_pins pcu_alias]
mcu: pcu
aliases:
aliases_both_sides:
  taut=PA3,
  slack=PA4,
aliases_lane0:
  sensor_0=PB9,
  lane0_step=PB15,
  lane0_dir=PB14,
  lane0_enable=PA8,
  lane0_uart=PA10,
aliases_lane1:
  sensor_1=PB8,
  lane1_step=PD2,
  lane1_dir=PB13,
  lane1_enable=PD1,
  lane1_uart=PC7,

# ========================
# SENSORS
# ========================
# Fox Feeder's sensor suite

# Slacker tension sensors (both sides of bowden)
[filament_switch_sensor mmu_taut]
switch_pin: ^!pcu:taut
pause_on_runout: False

[filament_switch_sensor mmu_slack]
switch_pin: ^!pcu:slack
pause_on_runout: False

# Gate sensors (filament presence at each lane)
[filament_switch_sensor mmu_gate_0]
switch_pin: ^pcu:sensor_0
pause_on_runout: False

[filament_switch_sensor mmu_gate_1]
switch_pin: ^pcu:sensor_1
pause_on_runout: False

# ========================
# FOX FEEDER MACROS
# ========================
# Preserve Fox Feeder's proven macro logic
# These integrate with Happy Hare's workflow

[gcode_macro _MMU_FORM_TIP]
description: Fox Feeder tip forming sequence
gcode:
  SAVE_GCODE_STATE NAME=FORMTIPSTATE
  G91
  G0 E-22 F3600
  G0 E22.4 F3600
  G0 E-22 F3600
  G0 E2 F300
  G0 E-2.1 F300
  G0 E2 F300
  G0 E-2.2 F300
  G0 E2 F300
  G0 E-2.3 F300
  G0 E2 F300
  G0 E-2.4 F300
  G0 E2 F300
  G0 E-2.5 F300
  G0 E2 F300
  G0 E-33 F300
  G90
  RESTORE_GCODE_STATE NAME=FORMTIPSTATE

[gcode_macro _MMU_PRE_UNLOAD]
description: Actions before unloading filament
gcode:
  # Ensure extruder is hot enough
  {% if printer.extruder.temperature < 210 %}
    M104 S210
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM=205
  {% endif %}

[gcode_macro _MMU_POST_LOAD]
description: Actions after loading filament
gcode:
  # Enable Slacker sensors for print monitoring
  SET_FILAMENT_SENSOR SENSOR=mmu_taut ENABLE=1
  SET_FILAMENT_SENSOR SENSOR=mmu_slack ENABLE=1

[gcode_macro _MMU_POST_UNLOAD]
description: Actions after unloading filament
gcode:
  # Disable Slacker sensors during tool changes
  SET_FILAMENT_SENSOR SENSOR=mmu_taut ENABLE=0
  SET_FILAMENT_SENSOR SENSOR=mmu_slack ENABLE=0

# ========================
# STARTUP CONFIGURATION
# ========================
[delayed_gcode MMU_STARTUP]
initial_duration: 5
gcode:
  # Initialize Happy Hare on startup
  MMU_HOME
  # Disable Slacker sensors during homing
  SET_FILAMENT_SENSOR SENSOR=mmu_taut ENABLE=0
  SET_FILAMENT_SENSOR SENSOR=mmu_slack ENABLE=0

# ========================
# MAINTENANCE MACROS
# ========================
# Fox Feeder specific maintenance commands

[gcode_macro MEASURE_BOWDEN]
description: Measure bowden length for calibration
gcode:
  RESPOND MSG="Use MMU_CALIBRATE_BOWDEN for Happy Hare calibration"
  RESPOND MSG="Or use original Fox Feeder MEASURE_BOWDEN from WIP_MMU.cfg"

[gcode_macro FOX_FEEDER_STATUS]
description: Display Fox Feeder specific status
gcode:
  RESPOND MSG="Fox Feeder MMU Status:"
  RESPOND MSG="Active Gate: {printer.mmu.gate}"
  RESPOND MSG="Tool: T{printer.mmu.tool}"
  RESPOND MSG="Filament Position: {printer.mmu.filament_pos}"
  RESPOND MSG="Gate 0 Sensor: {'TRIGGERED' if printer['filament_switch_sensor mmu_gate_0'].filament_detected else 'EMPTY'}"
  RESPOND MSG="Gate 1 Sensor: {'TRIGGERED' if printer['filament_switch_sensor mmu_gate_1'].filament_detected else 'EMPTY'}"
  RESPOND MSG="Taut Sensor: {'TRIGGERED' if printer['filament_switch_sensor mmu_taut'].filament_detected else 'CLEAR'}"
  RESPOND MSG="Slack Sensor: {'TRIGGERED' if printer['filament_switch_sensor mmu_slack'].filament_detected else 'CLEAR'}"
