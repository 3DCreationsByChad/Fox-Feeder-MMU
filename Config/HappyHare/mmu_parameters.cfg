# Fox Feeder MMU - Happy Hare Parameters Configuration
# Operational parameters optimized for Fox Feeder's design

[mmu_parameters]

# ========================
# BASIC OPERATION
# ========================
# Fox Feeder uses a simple, reliable loading strategy
enable_endless_spool: 1          # Support automatic spool switching
enable_spoolman: 0               # Spoolman integration (optional)
strict_filament_recovery: 0      # Relaxed recovery for simplicity
filament_recovery_on_pause: 1    # Recover filament when paused
retry_tool_change_on_error: 2    # Retry failed tool changes twice
print_start_detection: 1         # Auto-detect print start

# ========================
# TOOL CHANGE BEHAVIOR
# ========================
# How Happy Hare handles tool changes
z_hop_height_error: 5            # Z-hop on error (mm)
z_hop_height_toolchange: 0       # No Z-hop during normal changes
z_hop_speed: 15                  # Z-hop speed (mm/s)
enable_park: 1                   # Park toolhead during changes
park_x: 50                       # Park X position
park_y: 50                       # Park Y position
park_z_hop: 2                    # Z-hop when parking

# ========================
# LOADING/UNLOADING
# ========================
# Fox Feeder's proven loading sequence
# Based on existing macro logic from WIP_MMU.cfg

# Stage 1: Fast load through bowden
gate_unload_buffer: 30           # Distance to retract into buffer (mm)
gate_load_retries: 2             # Retries if gate load fails
gate_autoload: 1                 # Automatically detect and load

# Stage 2: Extruder feeding
extruder_load_length: 105        # Distance to feed into extruder (matches filament_feed_length)
extruder_unload_length: 105      # Distance to retract from extruder
extruder_sync_load_speed: 16     # Slow, controlled feed (mm/s)
extruder_sync_unload_speed: 16   # Slow, controlled retract
extruder_homing_max: 80          # Maximum distance to home to extruder

# Stage 3: Toolhead/nozzle
toolhead_entry_to_extruder: 0    # Distance from entry sensor to gears
toolhead_extruder_to_nozzle: 0   # Distance from gears to nozzle
toolhead_sensor_to_nozzle: 72    # Distance from toolhead sensor to nozzle
toolhead_residual_filament: 0    # Filament remaining after unload
toolhead_ooze_reduction: 0       # Retraction to prevent ooze

# ========================
# TIP FORMING
# ========================
# Use Fox Feeder's proven FORM_TIP sequence
# This is defined in the macros, Happy Hare will call it
force_form_tip_standalone: 1     # Always form tip (don't rely on slicer)
form_tip_macro: FORM_TIP         # Use Fox Feeder's tip forming macro

# ========================
# CALIBRATION
# ========================
# Fox Feeder calibration settings
auto_calibrate_gates: 0          # Manual calibration preferred
auto_calibrate_bowden: 0         # Use MEASURE_BOWDEN macro instead
gate_statistics: 1               # Track gate usage stats
gate_statistics_interval: 100    # Log stats every 100 swaps

# ========================
# LOGGING & FEEDBACK
# ========================
log_level: 1                     # Normal logging (0=essential, 1=info, 2=debug, 3=trace)
log_file_level: 3                # Detailed file logging
log_statistics: 1                # Log statistics
console_gate_stat_heatmap: 1     # Show visual gate stats in console
console_always_output_full: 1    # Always show full console output

# ========================
# SENSORS
# ========================
# Fox Feeder's Slacker sensor configuration
enable_toolhead_sensor: 1        # Use taut sensor as toolhead sensor
toolhead_sensor_detection_length: 10  # Distance to verify detection
enable_extruder_sensor: 1        # Use slack sensor as extruder sensor

gate_sensor_verification_length: 10   # Verify gate sensor with movement
extruder_sensor_validation_length: 10 # Verify extruder sensor
toolhead_sensor_validation_length: 10 # Verify toolhead sensor

# ========================
# SPEEDS & MOVEMENTS
# ========================
# Optimized for Fox Feeder's hardware
gear_buzz_accel: 1000            # Accel for buzz movements

# Synchronized moves (when synced with extruder)
sync_to_extruder: 1              # Enable synced moves
sync_form_tip: 1                 # Form tip while synced
sync_feedback_enable: 1          # Use Slacker feedback during sync
sync_multiplier_high: 1.05       # Multiplier for slack condition
sync_multiplier_low: 0.95        # Multiplier for taut condition

# ========================
# ADVANCED
# ========================
# Fox Feeder specific features
encoder_move_validation: 0       # No encoder on Fox Feeder
strict_filament_recovery_on_pause: 0  # Flexible recovery
gcode_load_sequence: 0           # Use Happy Hare's sequence
gcode_unload_sequence: 0         # Use Happy Hare's sequence

# Gate loading strategy
gate_homing_endstop: mmu_gate    # Home to gate sensor
gate_parking_distance: 23        # Distance to park filament in gate

# Bowden loading strategy
bowden_apply_correction: 0       # No correction needed
bowden_allowable_load_delta: 20  # Tolerance for load variance (mm)

# Pre-gate sensor behavior
enable_pre_gate_sensor: 1        # Fox Feeder has pre-gate sensors
pre_gate_sensor_homing_retract: 5  # Retract distance after homing

# Selector (disabled for Fox Feeder)
selector_offsets: 0, 0           # No selector movement
selector_bypass: 1               # Bypass selector movements
