#######################################################################
# Fox Feeder MMU - Parameters & Variables
#######################################################################
#
# All tunable parameters in one place. Adjust these to match your
# hardware setup. Inspired by Happy Hare's mmu_parameters.cfg.
#
# After changing values here, restart Klipper for them to take effect.
#
#######################################################################

[gcode_macro _FILAMENT_VARS]

# ==================== Lane Configuration ====================
variable_activelane: None
variable_lane_count: 2           # Number of lanes (2 or 4)
variable_infinitespool: 1        # Enable infinite spool mode

# ==================== Bowden Configuration ====================
variable_bowden_length: 980      # Total bowden length in mm.
                                 # Run MEASURE_BOWDEN to calibrate.
variable_filament_feed_length: 105  # Distance (mm) to clear extruder
                                    # gears during filament removal.

# ==================== Motion Parameters ====================
# Inspired by Happy Hare's separation of speed parameters for
# different move types.
variable_stepper_accel: 150      # Acceleration for MMU stepper moves
variable_stepper_speed: 45       # Default stepper speed
variable_bowden_fast_speed: 150  # Speed for long bowden transit moves
variable_bowden_slow_speed: 50   # Speed for sensor-seeking moves
variable_load_feed_rate: 500     # Feed rate (F value) for final
                                 # nozzle-loading extrusion moves

# ==================== Feature Flags ====================
# Enable these when you install the corresponding hardware.
# See mmu_hardware.cfg for hardware setup instructions.
variable_slacker_enabled: False  # Slacker tension monitoring active
variable_use_toolhead_sensor: False  # Toolhead filament sensor installed
                                     # Improves load/unload reliability.
variable_use_encoder: False      # Filament motion encoder installed
                                 # Enables clog detection during prints.
variable_use_leds: False         # Neopixel status LEDs installed
                                 # Per-lane visual status feedback.

# ==================== Runtime State ====================
# These are set automatically by macros. Do not modify.
variable_bowden_calculate: 0     # Used by MEASURE_BOWDEN
variable_pause_flag: False       # Used by LOAD_FILAMENT retry logic

gcode:
    {action_respond_info(" Running the VARIABLE_STORE macro does nothing")}
