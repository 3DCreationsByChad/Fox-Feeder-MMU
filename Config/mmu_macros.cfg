#######################################################################
# Fox Feeder MMU - Operational Macros
#######################################################################
#
# All filament management macros: loading, unloading, lane switching,
# status checking, calibration, and self-centering.
#
# Sensor names used throughout:
#   slacker_taut   - Slacker tension sensor (shared)
#   slacker_slack  - Slacker slack sensor (shared)
#   lane_N_sensor  - Per-lane filament presence (N = 0, 1, 2, 3)
#   toolhead_sensor - Optional toolhead entry sensor
#
# New features (inspired by Happy Hare):
#   - Toolhead sensor integration for reliable load/unload confirmation
#   - Encoder clog detection handler
#   - LED status updates per lane
#   - Scalable SET_LANE for 2+ lane configs
#
#######################################################################


# ==================== Extruder Control ====================

[gcode_macro SYNC_EXTRUDER]
gcode:
  {% set lane = params.LANE %}
  {% if not printer['extruder_stepper stepper_' + lane|string].motion_queue == 'extruder' %}
    SYNC_EXTRUDER_MOTION EXTRUDER=stepper_{lane} MOTION_QUEUE=extruder
  {% endif %}

[gcode_macro ISOLATE_EXTRUDER]
gcode:
  {% set lane = params.LANE %}
  {% if printer['extruder_stepper stepper_' + lane|string].motion_queue == 'extruder' %}
    SYNC_EXTRUDER_MOTION EXTRUDER=stepper_{lane} MOTION_QUEUE=
  {% endif %}


# ==================== Status & Detection ====================

[gcode_macro CHECK_STATUS]
gcode:
  {% set lane = 0 %}
  {% set stepper_accel = printer["gcode_macro _FILAMENT_VARS"].stepper_accel %}
  {% for lane in range(printer["gcode_macro _FILAMENT_VARS"].lane_count) %}
    {% if printer['filament_switch_sensor lane_' + lane|string + '_sensor'].filament_detected and not printer["filament_switch_sensor slacker_taut"].filament_detected %}
      ISOLATE_EXTRUDER LANE={lane}
      FORCE_MOVE STEPPER="extruder_stepper stepper_{lane}" DISTANCE=6 VELOCITY=50 ACCEL={stepper_accel}
      M400
      {% set step = 0 %}
      {% for step in range(10) %}
        M400
        _PUSHING_CHECK LANE={lane} STEP={step}
        M400
      {% endfor %}
    {% elif printer['filament_switch_sensor lane_' + lane|string + '_sensor'].filament_detected %}
      ISOLATE_EXTRUDER LANE={lane}
      FORCE_MOVE STEPPER="extruder_stepper stepper_{lane}" DISTANCE=-6 VELOCITY=50 ACCEL={stepper_accel}
      M400
      {% set step = 0 %}
      {% for step in range(350) %}
        M400
        _PULLING_CHECK LANE={lane} STEP={step}
        M400
      {% endfor %}
    {% elif not printer['filament_switch_sensor lane_' + lane|string + '_sensor'].filament_detected %}
      ISOLATE_EXTRUDER LANE={lane}
      FORCE_MOVE STEPPER="extruder_stepper stepper_{lane}" DISTANCE=20 VELOCITY=50 ACCEL={stepper_accel}
      M400
      _CHECKING_LANE LANE={lane}
    {% else %}
      RESPOND MSG="Lane {lane}: No Filament is loaded"
    {% endif %}
  {% endfor %}

[gcode_macro _PUSHING_CHECK]
gcode:
  {% set lane = params.LANE %}
  {% set step = params.STEP|int %}
  {% set stepper_accel = printer["gcode_macro _FILAMENT_VARS"].stepper_accel %}
  {% if printer["filament_switch_sensor slacker_slack"].filament_detected and printer['filament_switch_sensor lane_' + lane|string + '_sensor'].filament_detected %}
    ISOLATE_EXTRUDER LANE={lane}
    M400
    FORCE_MOVE STEPPER="extruder_stepper stepper_{lane}" DISTANCE=6 VELOCITY=50 ACCEL={stepper_accel}
    M400
  {% endif %}
  {% if step == 9 and not printer["filament_switch_sensor slacker_slack"].filament_detected and printer['filament_switch_sensor lane_' + lane|string + '_sensor'].filament_detected %}
    RESPOND MSG="Lane {lane} - Filament is at toolhead"
    SET_LANE LANE={lane}
  {% elif step == 9 %}
    REMOVE_FILAMENT LANE={lane} SKIPCHECK=True
    RESPOND MSG="Lane {lane} - Filament is ready"
  {% endif %}

[gcode_macro _PULLING_CHECK]
gcode:
  {% set lane = params.LANE %}
  {% set step = params.STEP|int %}
  {% set stepper_accel = printer["gcode_macro _FILAMENT_VARS"].stepper_accel %}
  {% if printer["filament_switch_sensor slacker_taut"].filament_detected and printer['filament_switch_sensor lane_' + lane|string + '_sensor'].filament_detected %}
    ISOLATE_EXTRUDER LANE={lane}
    M400
    FORCE_MOVE STEPPER="extruder_stepper stepper_{lane}" DISTANCE=-6 VELOCITY=50 ACCEL={stepper_accel}
    M400
  {% endif %}
  {% if step == 349 and not printer["filament_switch_sensor slacker_taut"].filament_detected and printer['filament_switch_sensor lane_' + lane|string + '_sensor'].filament_detected %}
    RESPOND MSG="Lane {lane} - Filament is at toolhead"
    SET_LANE LANE={lane}
  {% elif step == 349 %}
    RESPOND MSG="Lane {lane} - Filament is ready"
  {% endif %}

[gcode_macro _CHECKING_LANE]
gcode:
  {% set lane = params.LANE %}
  {% if not printer['filament_switch_sensor lane_' + lane|string + '_sensor'].filament_detected %}
    RESPOND MSG="Lane {lane}: No Filament is loaded"
  {% else %}
    REMOVE_FILAMENT LANE={lane} SKIPCHECK=True
    RESPOND MSG="Lane {lane}: Filament is ready"
  {% endif %}


# ==================== Lane Management ====================

[gcode_macro SET_LANE]
description: Detect or manually set the active filament lane
gcode:
  {% set specified = params.SPECIFIED|default(None) %}
  {% set lane_count = printer["gcode_macro _FILAMENT_VARS"].lane_count %}
  {% set use_leds = printer["gcode_macro _FILAMENT_VARS"].use_leds %}
  {% if not specified == None %}
    RESPOND MSG="Activating Lane {specified}"
    SET_GCODE_VARIABLE MACRO=_FILAMENT_VARS VARIABLE=activelane VALUE={specified}
    {% if use_leds %}
      _SET_LED_STATUS LANE={specified} STATUS=active
    {% endif %}
  {% else %}
    # Auto-detect: find which lane has filament
    {% set detected = [] %}
    {% for i in range(lane_count) %}
      {% if printer['filament_switch_sensor lane_' + i|string + '_sensor'].filament_detected %}
        {% set _ = detected.append(i) %}
      {% endif %}
    {% endfor %}
    {% if detected|length > 1 %}
      RESPOND TYPE=error msg="!! UNABLE TO DETECT SPOOL, MULTIPLE SENSORS TRIGGERED !!"
    {% elif detected|length == 1 %}
      RESPOND MSG="Activating Lane {detected[0]}"
      SET_GCODE_VARIABLE MACRO=_FILAMENT_VARS VARIABLE=activelane VALUE={detected[0]}
      {% if use_leds %}
        _SET_LED_STATUS LANE={detected[0]} STATUS=active
      {% endif %}
    {% else %}
      RESPOND TYPE=error msg="!! NO FILAMENT DETECTED IN ANY LANE !!"
    {% endif %}
  {% endif %}

[delayed_gcode INITIAL_SET_LANE]
initial_duration: 5
gcode:
  SET_FILAMENT_SENSOR SENSOR=slacker_taut ENABLE=0
  SET_FILAMENT_SENSOR SENSOR=slacker_slack ENABLE=0
  CHECK_STATUS


# ==================== Filament Loading ====================

[gcode_macro LOAD_FILAMENT]
description: Load filament from a lane through the bowden to the nozzle
gcode:
  {% set temp = params.TEMP %}
  {% set lane = params.LANE %}
  {% set use_toolhead = printer["gcode_macro _FILAMENT_VARS"].use_toolhead_sensor %}
  {% set use_leds = printer["gcode_macro _FILAMENT_VARS"].use_leds %}
  M104 S{temp}
  {% set FAST_MOVE = printer["gcode_macro _FILAMENT_VARS"].bowden_length - 10 %}
  {% set SLOW_MOVE = printer["gcode_macro _FILAMENT_VARS"].filament_feed_length - 40 %}
  {% set stepper_accel = printer["gcode_macro _FILAMENT_VARS"].stepper_accel %}
  {% set fast_speed = printer["gcode_macro _FILAMENT_VARS"].bowden_fast_speed %}
  {% set feed_rate = printer["gcode_macro _FILAMENT_VARS"].load_feed_rate %}
  {% if use_leds %}
    _SET_LED_STATUS LANE={lane} STATUS=loading
  {% endif %}
  {% if not printer['filament_switch_sensor lane_' + lane|string + '_sensor'].filament_detected %}
    REMOVE_FILAMENT
    RESPOND MSG="Fast loading the bowden..."
    ISOLATE_EXTRUDER LANE={lane}
    FORCE_MOVE STEPPER="extruder_stepper stepper_{lane}" DISTANCE={FAST_MOVE} VELOCITY={fast_speed} ACCEL={stepper_accel}
    M400
  {% endif %}
  RESPOND MSG="Pushing filament to the extruder..."
  M83
  {% set step = 0 %}
  {% for step in range(350) %}
    M400
    _LOADING_FILAMENT LANE={lane}
    M400
  {% endfor %}
  M104 S{temp}
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp|int - 5 }
  RESPOND MSG="Pushing filament to the nozzle..."
  SYNC_EXTRUDER LANE={lane}
  G1 E{SLOW_MOVE} F{feed_rate}
  # Verify filament is being pulled by extruder
  {% if use_toolhead and printer["filament_switch_sensor toolhead_sensor"].filament_detected %}
    # Toolhead sensor confirms filament arrived - success
    RESPOND MSG="Toolhead sensor: filament detected"
  {% else %}
    # Fallback: step-based check (original behavior)
    FORCE_MOVE STEPPER="extruder" DISTANCE=6 VELOCITY=10 ACCEL={stepper_accel}
    M400
    SET_GCODE_VARIABLE MACRO=_FILAMENT_VARS VARIABLE=pause_flag VALUE=True
    {% set step = 0 %}
    {% for step in range(6) %}
      M400
      _LOADING_FILAMENT_CHECK STEP={step}
      M400
    {% endfor %}
  {% endif %}

[gcode_macro _LOADING_FILAMENT]
gcode:
  {% set lane = params.LANE %}
  {% set stepper_accel = printer["gcode_macro _FILAMENT_VARS"].stepper_accel %}
  {% if printer["filament_switch_sensor slacker_slack"].filament_detected %}
    FORCE_MOVE STEPPER="extruder_stepper stepper_{lane}" DISTANCE=6 VELOCITY=50 ACCEL={stepper_accel}
    M400
  {% endif %}

[gcode_macro _LOADING_FILAMENT_CHECK]
gcode:
  {% set step = params.STEP|int %}
  {% set stepper_accel = printer["gcode_macro _FILAMENT_VARS"].stepper_accel %}
  {% if step == 5 and printer["gcode_macro _FILAMENT_VARS"].pause_flag == True %}
    RESPOND TYPE=ERROR MSG="Tried to load filament 5 times, pausing print. Please load manually."
    PAUSE
  {% elif printer["filament_switch_sensor slacker_slack"].filament_detected %}
    SET_GCODE_VARIABLE MACRO=_FILAMENT_VARS VARIABLE=pause_flag VALUE=False
  {% elif not printer["filament_switch_sensor slacker_slack"].filament_detected %}
    RESPOND MSG="Pulling... "
    M400
    M400
    FORCE_MOVE STEPPER="extruder" DISTANCE=6 VELOCITY=10 ACCEL={stepper_accel}
    M400
  {% endif %}


# ==================== Filament Removal ====================

[gcode_macro REMOVE_FILAMENT]
description: Remove filament from the system, retracting from toolhead through bowden
gcode:
  {% set lane = params.LANE|default(printer["gcode_macro _FILAMENT_VARS"].activelane) %}
  {% set skipcheck = params.SKIPCHECK|default(False) %}
  {% set use_leds = printer["gcode_macro _FILAMENT_VARS"].use_leds %}
  {% set CURRENT_ACCEL = printer.toolhead.max_accel %}
  SET_VELOCITY_LIMIT ACCEL=50
  M83
  {% if lane is none or lane == "" %}
    RESPOND MSG="No filament to unload..."
  {% elif not printer["filament_switch_sensor slacker_slack"].filament_detected and printer['filament_switch_sensor lane_' + lane|string + '_sensor'].filament_detected and skipcheck == False %}
    RESPOND MSG="Retracting filament in Lane {lane} from toolhead..."
    _UNLOAD_TOOLHEAD LANE={lane}
  {% elif printer["filament_switch_sensor slacker_slack"].filament_detected and printer['filament_switch_sensor lane_' + lane|string + '_sensor'].filament_detected and skipcheck == False %}
    RESPOND MSG="Unsure of filament location, carefully retracting filament in Lane {lane}..."
    _UNLOAD_TOOLHEAD LANE={lane}
  {% endif %}
  {% if lane is none or lane == "" %}
    #do nothing
  {% elif printer['filament_switch_sensor lane_' + lane|string + '_sensor'].filament_detected %}
    RESPOND MSG="Carefully retracting filament in Lane {lane}..."
    {% set step = 0 %}
    {% for step in range(350) %}
      M400
      _REMOVING_FILAMENT LANE={lane}
      M400
    {% endfor %}
  {% endif %}
  {% if use_leds and lane is not none and lane != "" %}
    _SET_LED_STATUS LANE={lane} STATUS=empty
  {% endif %}

[gcode_macro _REMOVING_FILAMENT]
gcode:
  {% set lane = params.LANE %}
  {% set stepper_accel = printer["gcode_macro _FILAMENT_VARS"].stepper_accel %}
  {% if printer['filament_switch_sensor lane_' + lane|string + '_sensor'].filament_detected %}
    ISOLATE_EXTRUDER LANE={lane}
    M400
    FORCE_MOVE STEPPER="extruder_stepper stepper_{lane}" DISTANCE=-5 VELOCITY=50 ACCEL={stepper_accel}
    M400
  {% endif %}

[gcode_macro _UNLOAD_TOOLHEAD]
gcode:
  {% set lane = params.LANE %}
  {% set stepper_accel = printer["gcode_macro _FILAMENT_VARS"].stepper_accel %}
  {% set fast_speed = printer["gcode_macro _FILAMENT_VARS"].bowden_fast_speed %}
  {% set use_toolhead = printer["gcode_macro _FILAMENT_VARS"].use_toolhead_sensor %}
  {% set SLOW_MOVE = printer["gcode_macro _FILAMENT_VARS"].filament_feed_length %}
  {% set FAST_MOVE = printer["gcode_macro _FILAMENT_VARS"].bowden_length - SLOW_MOVE - 30 %}
  {% if printer.extruder.temperature < 210 %}
    M104 S210
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM=205
  {% endif %}
  SYNC_EXTRUDER LANE={lane}
  FORM_TIP
  M400
  G1 E-{SLOW_MOVE} F1000
  # If toolhead sensor installed, verify filament cleared the sensor
  {% if use_toolhead %}
    {% if printer["filament_switch_sensor toolhead_sensor"].filament_detected %}
      RESPOND MSG="Warning: toolhead sensor still triggered after retract"
      G1 E-20 F500
    {% endif %}
  {% endif %}
  ISOLATE_EXTRUDER LANE={lane}
  M400
  FORCE_MOVE STEPPER="extruder_stepper stepper_{lane}" DISTANCE=-{FAST_MOVE} VELOCITY={fast_speed} ACCEL={stepper_accel}
  M400


# ==================== Lane Switching ====================

[gcode_macro LS]
description: Lane Switch - unload current filament and load from specified lane
gcode:
  {% set lane = params.LANE %}
  {% set temp = params.TEMP %}
  {% set activel = printer["gcode_macro _FILAMENT_VARS"].activelane %}
  SET_FILAMENT_SENSOR SENSOR=slacker_taut ENABLE=0
  SET_FILAMENT_SENSOR SENSOR=slacker_slack ENABLE=0
  {% if lane|int != activel|int %}
    M104 S{temp}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp|int - 5 }
    REMOVE_FILAMENT
    SET_LANE SPECIFIED={lane}
    LOAD_FILAMENT TEMP={temp} LANE={lane}
  {% elif not printer['filament_switch_sensor lane_' + lane|string + '_sensor'].filament_detected %}
    LOAD_FILAMENT TEMP={temp} LANE={lane}
  {% endif %}
  _SELF_CENTER LANE={lane}
  SET_LANE SPECIFIED={lane}
  SYNC_EXTRUDER LANE={lane}
  M104 S{temp}
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp|int - 5 }
  SET_FILAMENT_SENSOR SENSOR=slacker_taut ENABLE=1
  SET_FILAMENT_SENSOR SENSOR=slacker_slack ENABLE=1


# ==================== Self-Centering ====================

[gcode_macro _SELF_CENTER]
gcode:
  {% set lane = params.LANE %}
  {% set stepper_accel = printer["gcode_macro _FILAMENT_VARS"].stepper_accel %}
  {% if not printer["filament_switch_sensor slacker_taut"].filament_detected %}
    ISOLATE_EXTRUDER LANE={lane}
    FORCE_MOVE STEPPER="extruder_stepper stepper_{lane}" DISTANCE=6 VELOCITY=50 ACCEL={stepper_accel}
    M400
    {% set step = 0 %}
    {% for step in range(10) %}
      M400
      _PUSHING_CENTER LANE={lane} STEP={step}
      M400
    {% endfor %}
  {% elif not printer["filament_switch_sensor slacker_slack"].filament_detected %}
    ISOLATE_EXTRUDER LANE={lane}
    FORCE_MOVE STEPPER="extruder_stepper stepper_{lane}" DISTANCE=-6 VELOCITY=50 ACCEL={stepper_accel}
    M400
    {% set step = 0 %}
    {% for step in range(10) %}
      M400
      _PULLING_CENTER LANE={lane} STEP={step}
      M400
    {% endfor %}
  {% endif %}

[gcode_macro _PUSHING_CENTER]
gcode:
  {% set lane = params.LANE %}
  {% set step = params.STEP|int %}
  {% set stepper_accel = printer["gcode_macro _FILAMENT_VARS"].stepper_accel %}
  {% if not printer["filament_switch_sensor slacker_taut"].filament_detected %}
    ISOLATE_EXTRUDER LANE={lane}
    M400
    FORCE_MOVE STEPPER="extruder_stepper stepper_{lane}" DISTANCE=6 VELOCITY=50 ACCEL={stepper_accel}
    M400
  {% elif step == 9 and printer["filament_switch_sensor slacker_taut"].filament_detected %}
    SET_LANE LANE={lane}
  {% elif step == 9 %}
    RESPOND TYPE=error MSG="Slacker couldn't find center"
  {% endif %}

[gcode_macro _PULLING_CENTER]
gcode:
  {% set lane = params.LANE %}
  {% set step = params.STEP|int %}
  {% set stepper_accel = printer["gcode_macro _FILAMENT_VARS"].stepper_accel %}
  {% if not printer["filament_switch_sensor slacker_slack"].filament_detected %}
    ISOLATE_EXTRUDER LANE={lane}
    M400
    FORCE_MOVE STEPPER="extruder_stepper stepper_{lane}" DISTANCE=-6 VELOCITY=50 ACCEL={stepper_accel}
    M400
  {% elif step == 9 and printer["filament_switch_sensor slacker_slack"].filament_detected %}
    SET_LANE LANE={lane}
  {% elif step == 9 %}
    RESPOND TYPE=error MSG="Slacker couldn't find center"
  {% endif %}


# ==================== Bowden Calibration ====================

[gcode_macro MEASURE_BOWDEN]
description: Calibrate bowden tube length by measuring filament travel
gcode:
  {% set lane = printer["gcode_macro _FILAMENT_VARS"].activelane %}
  {% if printer["gcode_macro _FILAMENT_VARS"].activelane == None %}
    RESPOND MSG="No spool active. Activate a spool first"
  {% else %}
    RESPOND MSG="Removing Filament to starting location"
    REMOVE_FILAMENT
    RESPOND MSG="Starting Measurement"
    SET_GCODE_VARIABLE MACRO=_FILAMENT_VARS VARIABLE=bowden_calculate VALUE=0
    M83
    {% set step = 0 %}
    {% for step in range(350) %}
      M400
      _MEASURING_BOWDEN
      M400
    {% endfor %}
    _MEASURING_BOWDEN_CHECK
  {% endif %}

[gcode_macro _MEASURING_BOWDEN]
gcode:
  {% set lane = printer["gcode_macro _FILAMENT_VARS"].activelane %}
  {% set stepper_accel = printer["gcode_macro _FILAMENT_VARS"].stepper_accel %}
  {% if printer["filament_switch_sensor slacker_slack"].filament_detected %}
    M400
    FORCE_MOVE STEPPER="extruder_stepper stepper_{lane}" DISTANCE=10 VELOCITY=50 ACCEL={stepper_accel}
    M400
    {% set MEASUREMENT = printer["gcode_macro _FILAMENT_VARS"].bowden_calculate + 10 %}
    SET_GCODE_VARIABLE MACRO=_FILAMENT_VARS VARIABLE=bowden_calculate VALUE={MEASUREMENT}
  {% endif %}

[gcode_macro _MEASURING_BOWDEN_CHECK]
gcode:
  {% if printer["filament_switch_sensor slacker_slack"].filament_detected %}
    RESPOND TYPE=error msg="!! FAULT WITH EXTRUDER FILAMENT LOADING !!"
  {% else %}
    RESPOND MSG="Bowden length is "{printer["gcode_macro _FILAMENT_VARS"].bowden_calculate}
  {% endif %}


# ==================== Encoder Clog Detection ====================
# This macro is called by the filament_motion_sensor when it detects
# no filament movement (potential clog). Only active when encoder is
# installed and use_encoder is True in mmu_parameters.cfg.

[gcode_macro _ENCODER_RUNOUT]
description: Handle encoder-detected clog or runout
gcode:
  {% set use_encoder = printer["gcode_macro _FILAMENT_VARS"].use_encoder %}
  {% set use_leds = printer["gcode_macro _FILAMENT_VARS"].use_leds %}
  {% set lane = printer["gcode_macro _FILAMENT_VARS"].activelane %}
  {% if use_encoder %}
    RESPOND TYPE=error MSG="!! ENCODER: Filament motion not detected - possible clog !!"
    {% if use_leds and lane is not none %}
      _SET_LED_STATUS LANE={lane} STATUS=error
    {% endif %}
    PAUSE
  {% endif %}


# ==================== LED Status ====================
# Per-lane Neopixel LED control. Only active when use_leds is True.
# Colors: green=ready, blue=active, yellow=loading, red=error, off=empty

[gcode_macro _SET_LED_STATUS]
description: Set per-lane LED color based on filament state
gcode:
  {% set lane = params.LANE|int %}
  {% set status = params.STATUS|default("off") %}
  {% set use_leds = printer["gcode_macro _FILAMENT_VARS"].use_leds %}
  {% if use_leds %}
    {% set index = lane + 1 %}
    {% if status == "active" %}
      SET_LED LED=mmu_leds INDEX={index} RED=0.0 GREEN=0.0 BLUE=1.0 TRANSMIT=1
    {% elif status == "ready" %}
      SET_LED LED=mmu_leds INDEX={index} RED=0.0 GREEN=1.0 BLUE=0.0 TRANSMIT=1
    {% elif status == "loading" %}
      SET_LED LED=mmu_leds INDEX={index} RED=1.0 GREEN=0.8 BLUE=0.0 TRANSMIT=1
    {% elif status == "error" %}
      SET_LED LED=mmu_leds INDEX={index} RED=1.0 GREEN=0.0 BLUE=0.0 TRANSMIT=1
    {% elif status == "empty" %}
      SET_LED LED=mmu_leds INDEX={index} RED=0.0 GREEN=0.0 BLUE=0.0 TRANSMIT=1
    {% endif %}
  {% endif %}
