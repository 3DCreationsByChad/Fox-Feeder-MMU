#######################################################################
# Fox Feeder MMU - Master Configuration
#######################################################################
#
# Fox Feeder MMU - A low-cost, multi-lane filament changer for Klipper.
# Inspired by Happy Hare's modular config approach.
#
# File structure:
#   mmu.cfg            - This file (master includes + force_move)
#   mmu_hardware.cfg   - MCU, pin aliases, steppers, drivers, sensors, LEDs
#   mmu_parameters.cfg - Tuning variables (speeds, distances, feature flags)
#   mmu_macros.cfg     - Operational macros (load, unload, lane switch, etc.)
#   mmu_helpers.cfg    - Utility macros (tip forming, purge, nozzle scrub)
#
# Getting started:
#   1. Edit mmu_hardware.cfg - Set your MCU canbus_uuid and pin aliases
#   2. Edit mmu_parameters.cfg - Set bowden_length, lane_count, speeds
#   3. Add [include Config/mmu.cfg] to your printer.cfg
#   4. Run MEASURE_BOWDEN to calibrate bowden length
#
#######################################################################

[force_move]
enable_force_move: True

[include mmu_hardware.cfg]
[include mmu_parameters.cfg]
[include mmu_macros.cfg]
[include mmu_helpers.cfg]
