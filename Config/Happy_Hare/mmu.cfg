########################################################################################################################
# Happy Hare MMU configuration for Fox Feeder MMU
#
# MCU and Pin Aliases
#
# This file defines the MCU connection and pin aliases for the Fox Feeder's
# CAN-bus connected PCU board. Adjust canbus_uuid to match your board.
#
# ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE
#
# Note about active vs inactive: Active sections must be uncommented for the
# config to work. Inactive sections remain commented as they're not populated
# during installation. Check the wiki for more information on these options.
#
########################################################################################################################

# -------------------------------------------------------------------------------------------------
# MCU Connection - Fox Feeder PCU (CAN bus)
# -------------------------------------------------------------------------------------------------
[mcu mmu]
canbus_uuid: 2ad289e306d3


# -------------------------------------------------------------------------------------------------
# Pin Aliases - Fox Feeder PCU Board (2-Lane)
#
# Pin mapping for Fox Feeder PCU board:
#   Gear 0:  step=PB15, dir=PB14, enable=PA8,  uart=PA10
#   Gear 1:  step=PD2,  dir=PB13, enable=PD1,  uart=PC7
#   Gate sensors (post-gear): sensor_0=PB9, sensor_1=PB8
#   Slacker sensors: taut=PA3, slack=PA4
#
# NOTE: If your board has additional pins for LEDs or pre-gate sensors,
#       add them to the aliases below.
# -------------------------------------------------------------------------------------------------
[board_pins mmu]
mcu: mmu
aliases:
    # Gear stepper 0 (gate 0) - base stepper
    MMU_GEAR_STEP=PB15,
    MMU_GEAR_DIR=PB14,
    MMU_GEAR_ENABLE=PA8,
    MMU_GEAR_UART=PA10,

    # Gear stepper 1 (gate 1)
    MMU_GEAR_STEP_1=PD2,
    MMU_GEAR_DIR_1=PB13,
    MMU_GEAR_ENABLE_1=PD1,
    MMU_GEAR_UART_1=PC7,

    # Post-gear filament sensors (one per lane)
    MMU_POST_GEAR_0=PB9,
    MMU_POST_GEAR_1=PB8,

    # Slacker sensors (sync feedback)
    MMU_SYNC_FEEDBACK_TENSION=PA3,
    MMU_SYNC_FEEDBACK_COMPRESSION=PA4,

    # NeoPixel LEDs (uncomment and set pin if adding LEDs)
    #MMU_NEOPIXEL=<pin>,


# -------------------------------------------------------------------------------------------------
# Scaling a Fox Feeder to 4 Lanes
#
# To expand to 4 lanes, you will need a PCU board with additional stepper
# drivers and sensor inputs. Add the following aliases:
#
#   MMU_GEAR_STEP_2=<pin>, MMU_GEAR_DIR_2=<pin>, MMU_GEAR_ENABLE_2=<pin>, MMU_GEAR_UART_2=<pin>,
#   MMU_GEAR_STEP_3=<pin>, MMU_GEAR_DIR_3=<pin>, MMU_GEAR_ENABLE_3=<pin>, MMU_GEAR_UART_3=<pin>,
#   MMU_POST_GEAR_2=<pin>,
#   MMU_POST_GEAR_3=<pin>,
#
# Then update num_gates in mmu_hardware.cfg to 4 and add the corresponding
# stepper/driver sections in mmu_hardware.cfg.
# -------------------------------------------------------------------------------------------------
