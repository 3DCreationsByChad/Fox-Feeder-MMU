########################################################################################################################
# Happy Hare MMU Macro Variables for Fox Feeder MMU
#
# This file defines the macro configuration variables that control tip forming,
# toolchange parking, print start/end behavior, and other macro-driven features.
#
# Based on the upstream Happy Hare template with Fox Feeder-appropriate defaults.
# Most values here are the Happy Hare defaults — tune them for your specific setup.
#
# ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE
#
########################################################################################################################


# -------------------------------------------------------------------------------------------------
# PERSISTED STATE
#
# Happy Hare stores calibration and state in a klipper variables file.
# If you already have a [save_variables] section, merge the two and
# point this to your existing file.
# -------------------------------------------------------------------------------------------------
[save_variables]
filename: ~/printer_data/config/mmu/mmu_vars.cfg


# -------------------------------------------------------------------------------------------------
# KLIPPER OVERRIDES
#
# These are required by Happy Hare to allow long extrusion moves during
# loading/unloading. They override klipper's built-in safety limits.
# -------------------------------------------------------------------------------------------------
[extruder]
max_extrude_only_distance: 200
max_extrude_cross_section: 50

# For dialog prompts and progress in Mainsail (requires Mainsail >= v2.9.0)
[respond]

# Other Happy Hare prerequisites (harmless if already defined elsewhere)
[display_status]
[pause_resume]
[virtual_sdcard]
path: ~/printer_data/gcodes


# -------------------------------------------------------------------------------------------------
# PRINT START/END
#
# Controls behavior of MMU_START_SETUP and MMU_END macros.
# These replace the Fox Feeder's old print start/end logic.
# -------------------------------------------------------------------------------------------------
[gcode_macro _MMU_SOFTWARE_VARS]
description: Happy Hare configuration for print start/end checks
gcode: # Leave empty

# These variables control the behavior of the MMU_START_SETUP and MMU_START_LOAD_INITIAL_TOOL macros
variable_user_pre_initialize_extension      : ''	; Executed at start of MMU_START_SETUP. Commonly G28 to home
variable_home_mmu                           : False	; True/False, Whether to home mmu before print starts
variable_check_gates                        : True	; True/False, Whether to check filament is loaded in all gates used
variable_load_initial_tool                  : True	; True/False, Whether to automatically load initial tool
variable_automap_strategy                   : "none"	; none|filament_name|material|color|closest_color|spool_id

# These variables control the behavior of the MMU_END macro
variable_user_print_end_extension           : ''	; Executed at start of MMU_END
variable_unload_tool                        : True	; True/False, Whether to unload the tool at end of print
variable_reset_ttg                          : False	; True/False, Whether to reset TTG map at end of print
variable_dump_stats                         : True	; True/False, Whether to display print stats at end of print


# -------------------------------------------------------------------------------------------------
# STATE MACHINE CHANGES
#
# Hooks for Happy Hare state changes and maintenance tracking.
# -------------------------------------------------------------------------------------------------
[gcode_macro _MMU_STATE_VARS]
description: Happy Hare configuration for state change hooks
gcode: # Leave empty

variable_user_action_changed_extension      : ''	; Executed after default logic with duplicate params
variable_user_print_state_changed_extension : ''	; Executed after default logic with duplicate params
variable_user_mmu_event_extension           : ''	; Executed after default logic with duplicate params

# Maintenance warning limits (consumption counters)
# Fox Feeder has no servo or cutter, so set high or disable
variable_servo_down_limit                   : -1	; -1 = disabled (no servo on Fox Feeder)
variable_cutter_blade_limit                 : -1	; -1 = disabled (no cutter on Fox Feeder)


# -------------------------------------------------------------------------------------------------
# SEQUENCE MACRO - PARKING MOVEMENT AND TOOLCHANGE CONTROL
#
# Controls toolhead parking during tool changes, pauses, errors, etc.
# Fox Feeder defaults: minimal parking, let slicer handle wipetower positioning.
# -------------------------------------------------------------------------------------------------
[gcode_macro _MMU_SEQUENCE_VARS]
description: Happy Hare sequence macro configuration variables
gcode: # Leave empty

# Parking operations to enable (comma-separated list)
# Operations: toolchange, runout, load, unload, complete, pause, cancel
variable_enable_park_printing   : 'toolchange,runout,load,unload,complete,pause,cancel'
variable_enable_park_standalone : 'toolchange,load,unload,pause,cancel'
variable_enable_park_disabled   : 'pause,cancel'

variable_min_toolchange_z       : 1.0		; Absolute minimum z-height for all parking moves

# Parking positions: x, y, z_hop, z_hop_ramp, retract_length
# Use -999,-999 for no x,y move (just z_hop)
variable_park_toolchange        : -999, -999, 1,  5, 2	; Toolchange/load/unload
variable_park_runout            : -999, -999, 1,  5, 2	; Runout (forced toolchange)
variable_park_pause             : 50,   50,   5,  0, 2	; Pause/error
variable_park_cancel            : -999, -999, 10, 0, 5	; Cancel
variable_park_complete          : 50,   50,   10, 0, 5	; Print complete

# Additional intermediate parking positions: x, y, z_hop
variable_pre_unload_position    : -999, -999, 0
variable_post_form_tip_position : -999, -999, 0
variable_pre_load_position      : -999, -999, 0

variable_restore_xy_pos         : "last"	; last|next|none

# Movement speeds
variable_park_travel_speed      : 200		; XY travel speed mm/s
variable_park_lift_speed        : 15		; Z-only travel speed mm/s
variable_retract_speed          : 30		; Retract speed mm/s
variable_unretract_speed        : 30		; Unretract speed mm/s

# ADVANCED: Custom park move macro (leave empty for default G1 X Y move)
variable_user_park_move_macro   : ''

variable_auto_home              : True		; Auto-home if necessary
variable_timelapse              : False		; Take frame snapshot after load

# Extension hooks
variable_user_mmu_error_extension     : ''
variable_user_pre_unload_extension    : ''
variable_user_post_form_tip_extension : ''
variable_user_post_unload_extension   : ''
variable_user_pre_load_extension      : ''
variable_user_post_load_extension     : ''


# -------------------------------------------------------------------------------------------------
# FORM TIP CONFIGURATION
#
# Tip forming parameters for _MMU_FORM_TIP macro.
# This replaces the Fox Feeder's old FORM_TIP macro with tunable variables.
#
# TUNE THESE for your specific hotend! The defaults below are conservative
# starting values for a Dragon-style hotend with CW2 extruder.
# -------------------------------------------------------------------------------------------------
[gcode_macro _MMU_FORM_TIP_VARS]
description: Happy Hare tip forming macro configuration variables
gcode: # Leave empty

# Step 1 - Ramming
# Initial squeeze of filament before cooling moves
variable_ramming_volume            : 0		; Volume in mm^3, 0 = disabled (let slicer do it or skip)
variable_ramming_volume_standalone : 0		; Volume in mm^3, 0 = disabled

# Temperature change during tip forming (optional)
variable_toolchange_temp        : 0		; 0 = don't change temp, else set target temp
variable_toolchange_fan_assist  : False		; Use part fan to speed cooling
variable_toolchange_fan_name    : ''		; Fan name if not default [fan]
variable_toolchange_fan_speed   : 50		; Fan speed % if using fan_assist

# Step 2 - Nozzle Separation
variable_unloading_speed_start  : 80		; Fast initial separation speed mm/s
variable_unloading_speed        : 18		; Slow move to cooling zone mm/s

# Step 3 - Cooling Moves
# TUNE THESE for your hotend geometry!
variable_cooling_tube_position  : 35		; Start of cooling tube (mm from nozzle tip)
                                                ; DragonST:35, DragonHF:30, Mosquito:30, Revo:35, RapidoHF:27
variable_cooling_tube_length    : 10		; Cooling tube length (mm)
                                                ; DragonST:15, DragonHF:10, Mosquito:20, Revo:10, RapidoHF:10
variable_initial_cooling_speed  : 10		; Slow cooling move speed mm/s
variable_final_cooling_speed    : 50		; Fast cooling move speed mm/s
variable_cooling_moves          : 4		; Number of cooling moves (2-4 is a good start)

# Step 4 - Skinnydip (advanced - leave disabled initially)
variable_use_skinnydip          : False		; True = enable skinnydip
variable_skinnydip_distance     : 30		; Reinsert distance into hotend
variable_dip_insertion_speed    : 30		; Insertion speed mm/s
variable_dip_extraction_speed   : 70		; Extraction speed mm/s
variable_melt_zone_pause        : 0		; Pause in melt zone (ms)
variable_cooling_zone_pause     : 0		; Pause in cooling zone (ms)
variable_use_fast_skinnydip     : False		; Skip temp change wait during skinnydip

# Step 5 - Parking
variable_parking_distance       : 0		; 0 = leave where filament ends after tip forming
variable_extruder_eject_speed   : 25		; Speed for parking/eject mm/s


# -------------------------------------------------------------------------------------------------
# CUT TIP CONFIGURATION (not used on Fox Feeder - no cutter installed)
#
# If you add a Filametrix or similar toolhead cutter, uncomment and configure.
# -------------------------------------------------------------------------------------------------
[gcode_macro _MMU_CUT_TIP_VARS]
description: Happy Hare toolhead tip cutting macro configuration variables
gcode: # Leave empty

variable_restore_position       : False
variable_blade_pos              : 37.5
variable_retract_length         : 32.5
variable_simple_tip_forming     : True
variable_cut_axis_steppers      : 'stepper_x, stepper_y'
variable_cut_stepper_current    : 100
variable_cutting_axis           : "x"
variable_pin_loc_xy             : 14, 250
variable_pin_park_dist          : 5.0
variable_pin_loc_compressed_xy  : 0.5, 250
variable_rip_length             : 1.0
variable_rip_speed              : 3
variable_pushback_length        : 15.0
variable_pushback_dwell_time    : 0
variable_travel_speed           : 150
variable_cut_fast_move_speed    : 32
variable_cut_slow_move_speed    : 8
variable_evacuate_speed         : 150
variable_cut_dwell_time         : 50
variable_cut_fast_move_fraction : 1.0
variable_extruder_move_speed    : 25
variable_safe_margin_xy         : 30, 30
variable_gantry_servo_enabled   : False
variable_gantry_servo_down_angle: 55
variable_gantry_servo_up_angle  : 180


# -------------------------------------------------------------------------------------------------
# PURGE CONFIGURATION
# -------------------------------------------------------------------------------------------------
[gcode_macro _MMU_PURGE_VARS]
description: Happy Hare reference purging macro configuration variables
gcode: # Leave empty

variable_extruder_purge_speed   : 2		; Purge speed mm/s


# -------------------------------------------------------------------------------------------------
# CLIENT MACROS (PAUSE/RESUME/CANCEL)
# -------------------------------------------------------------------------------------------------
[gcode_macro _MMU_CLIENT_VARS]
description: Happy Hare client macro configuration variables
gcode: # Leave empty

variable_reset_ttg_on_cancel    : False
variable_unload_tool_on_cancel  : False

variable_user_pause_extension   : ''
variable_user_resume_extension  : ''
variable_user_cancel_extension  : ''


# -------------------------------------------------------------------------------------------------
# TOOL CHANGE MACROS
#
# These T0/T1 macros are required for Mainsail/Fluidd to show tool buttons.
# Add T2/T3 if expanding to 4 lanes.
# -------------------------------------------------------------------------------------------------
[gcode_macro T0]
gcode: MMU_CHANGE_TOOL TOOL=0
[gcode_macro T1]
gcode: MMU_CHANGE_TOOL TOOL=1
