########################################################################################################################
# Happy Hare MMU Parameters for Fox Feeder MMU
#
# Based on the VirtualSelector (type-B) parameter template.
# Tuned for Fox Feeder's 2-lane design with CW2-style 50:10 gears,
# Slacker tension/compression sensors, and ~980mm bowden length.
#
# NOTE: Many of these values can be auto-calibrated by Happy Hare. After
# initial setup, run the calibration routines and Happy Hare will update
# the persisted values in mmu_vars.cfg automatically.
#
# ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE
#
########################################################################################################################


# -------------------------------------------------------------------------------------------------
# GENERAL SETTINGS
# -------------------------------------------------------------------------------------------------
[mmu]
happy_hare_version: 3                   # Must match installed Happy Hare version
#
# Fox Feeder is registered as its own vendor preset in Happy Hare.
# These values are the FoxFeeder defaults — simpler than BoxTurtle:
#   - No encoder (Slacker replaces it)
#   - No espooler (passive Slacker buffer)
#   - No selector/servo (type-B per-lane motors)
#   - Short gate distances (compact design)
#   - has_filament_buffer: 0 (no rewinder/espooler, Slacker is passive)


# -------------------------------------------------------------------------------------------------
# HARDWARE LIMITS
# Max speeds the Fox Feeder gear steppers can handle.
# These are safety limits — actual move speeds are set below.
# -------------------------------------------------------------------------------------------------
gear_max_velocity: 300                  # Max gear stepper velocity (mm/s)
gear_max_accel: 1500                    # Max gear stepper acceleration (mm/s²)


# -------------------------------------------------------------------------------------------------
# LOGGING
# -------------------------------------------------------------------------------------------------
log_level: 1                            # 0=essential, 1=info, 2=debug, 3=trace, 4=stepper
log_file_level: 3                       # Log file verbosity (higher than console for troubleshooting)
log_statistics: 1                       # 1 = log swap statistics
log_visual: 1                           # 0 = off, 1 = log visual filament position
log_startup_status: 1                   # 1 = log tool-to-gate status on startup
log_m117_messages: 1                    # 1 = send toolchange messages to display


# -------------------------------------------------------------------------------------------------
# MOVEMENT SPEEDS
# Tuned for Fox Feeder's bowden length and CW2 gears.
# "from_spool" = loading from gate through buffer (gentle, avoid grinding)
# "from_buffer" = loading from buffer through bowden (can be faster)
# -------------------------------------------------------------------------------------------------
gear_from_spool_speed: 80               # Speed for initial load from spool/gate
gear_from_spool_accel: 100              # Accel for initial load (gentle)
gear_from_buffer_speed: 150             # Speed through bowden (buffer to extruder)
gear_from_buffer_accel: 400             # Accel through bowden
gear_unload_speed: 80                   # Speed for unloading through bowden
gear_unload_accel: 100                  # Accel for unloading
gear_short_move_speed: 80               # Speed for short corrective moves
gear_short_move_accel: 600              # Accel for short moves
gear_short_move_threshold: 70           # Moves shorter than this use short_move speeds

gear_homing_speed: 50                   # Speed when homing to sensors

extruder_load_speed: 16                 # Extruder-only load speed (mm/s)
extruder_unload_speed: 16               # Extruder-only unload speed
extruder_sync_load_speed: 18            # Synced gear+extruder load speed
extruder_sync_unload_speed: 18          # Synced gear+extruder unload speed
extruder_homing_speed: 18               # Speed for homing into extruder

# Acceleration limit for toolhead during tool changes (0 = printer default)
macro_toolhead_max_accel: 0
macro_toolhead_min_cruise_ratio: 0.5


# -------------------------------------------------------------------------------------------------
# GATE LOADING / UNLOADING
#
# How filament is loaded from the gate through the bowden.
# Fox Feeder uses post-gear sensors as the gate endstop (mmu_gate).
# -------------------------------------------------------------------------------------------------
gate_homing_endstop: mmu_gate           # Use post-gear sensor for homing
gate_homing_max: 70                     # Max distance to home to gate sensor (mm)
gate_preload_homing_max: 70             # Max distance for preload homing
gate_preload_parking_distance: -10      # Park distance after preload (-ve = behind sensor)
gate_unload_buffer: 50                  # Extra distance to ensure clear of gate
gate_parking_distance: 23               # Park distance from gate sensor after load
gate_endstop_to_encoder: 10             # Distance from gate sensor to encoder (if used)
gate_load_retries: 2                    # Number of grab attempts on initial load
gate_autoload: 1                        # 1 = auto-detect filament insertion at gate
gate_final_eject_distance: 0            # Extra distance to eject filament fully (0 = to sensor)


# -------------------------------------------------------------------------------------------------
# BOWDEN LOADING
#
# Fox Feeder bowden is ~980mm. Happy Hare can auto-calibrate this.
# After running MMU_CALIBRATE_BOWDEN, the calibrated value is stored
# in mmu_vars.cfg and overrides this default.
# -------------------------------------------------------------------------------------------------
bowden_homing_max: 2000                 # Safety max for bowden moves
bowden_apply_correction: 0              # 1 = apply encoder-based bowden correction
bowden_allowable_load_delta: 20.0       # Acceptable variation in bowden load length
bowden_pre_unload_test: 1               # Test filament is gripped before unloading
bowden_pre_unload_error_tolerance: 50   # Tolerance for pre-unload test (mm)


# -------------------------------------------------------------------------------------------------
# EXTRUDER HOMING
#
# How filament finds the extruder entrance.
# "collision" = detect stall when filament hits extruder gears (no sensor needed)
# If you add a toolhead entry sensor, change to "extruder"
# -------------------------------------------------------------------------------------------------
extruder_homing_max: 80                 # Max distance to search for extruder
extruder_homing_endstop: collision      # collision detection (no extra sensor needed)
extruder_homing_buffer: 25              # Distance to overshoot past endstop
extruder_collision_homing_current: 30   # Gear current % during collision detection
extruder_force_homing: 0               # 1 = always home to extruder (even if sensor says loaded)


# -------------------------------------------------------------------------------------------------
# TOOLHEAD LOADING
#
# Distance from extruder entrance to nozzle. Tune these for your toolhead.
# These values should match your printer's extruder setup.
# -------------------------------------------------------------------------------------------------
toolhead_homing_max: 40                 # Max distance to home inside toolhead
toolhead_extruder_to_nozzle: 72         # Total distance from extruder to nozzle tip
toolhead_sensor_to_nozzle: 62           # Distance from toolhead sensor to nozzle (if sensor exists)
toolhead_entry_to_extruder: 8           # Distance from entry sensor to extruder gears
toolhead_residual_filament: 0           # Residual filament in meltzone after tip form
toolhead_ooze_reduction: 0              # Nozzle reduction for ooze compensation
toolhead_unload_safety_margin: 10       # Extra retraction for safe unload
toolhead_post_load_tighten: 60          # Distance to tighten bowden after load (replaces _SELF_CENTER)
toolhead_post_load_tension_adjust: 1    # 1 = use sync feedback to find neutral position
toolhead_entry_tension_test: 1          # 1 = test for tension at entry
toolhead_move_error_tolerance: 60       # Tolerance for move error detection


# -------------------------------------------------------------------------------------------------
# TIP FORMING
#
# Happy Hare's tip forming replaces the Fox Feeder FORM_TIP macro.
# The actual tip forming parameters are in mmu_macro_vars.cfg under
# [gcode_macro _MMU_FORM_TIP_VARS].
# -------------------------------------------------------------------------------------------------
force_form_tip_standalone: 1            # 1 = always use standalone tip forming
form_tip_macro: _MMU_FORM_TIP          # Use Happy Hare's built-in macro
extruder_form_tip_current: 100          # Extruder current % during tip forming
slicer_tip_park_pos: 0                  # Slicer tip park position (0 = let HH handle)


# -------------------------------------------------------------------------------------------------
# PURGING
# -------------------------------------------------------------------------------------------------
force_purge_standalone: 0               # 0 = use slicer purging
purge_macro: _MMU_PURGE                 # Override macro for standalone purging
extruder_purge_current: 100


# -------------------------------------------------------------------------------------------------
# SYNCHRONIZED GEAR/EXTRUDER OPERATION
#
# THIS IS THE KEY SECTION FOR FOX FEEDER + SLACKER
#
# On type-B MMUs, the gear stepper is always synced to the extruder during
# printing. The Slacker's taut/slack sensors provide real-time tension feedback
# so Happy Hare can dynamically adjust gear speed to maintain neutral buffer position.
#
# sync_feedback_enabled: Activates the Slacker sensor feedback loop
# sync_feedback_buffer_range: Physical distance (mm) between taut and slack sensors
# sync_feedback_buffer_maxrange: Total travel range of the Slacker buffer mechanism
# sync_feedback_speed_multiplier: How aggressively to correct (% speed adjustment)
# -------------------------------------------------------------------------------------------------
sync_to_extruder: 0                     # Gear motor is synchronized to extruder during print
                                        # (Happy Hare controls this dynamically for type-B MMUs)
sync_gear_current: 70                   # Gear stepper current % when synced (lower = gentler)
sync_form_tip: 0                        # Synchronize during standalone tip formation
sync_purge: 0                           # Synchronize during standalone purging
sync_feedback_enabled: 1                # ENABLE Slacker feedback (this is the magic!)
sync_feedback_buffer_range: 6           # Distance between taut/slack sensor triggers (mm)
sync_feedback_buffer_maxrange: 12       # Total Slacker buffer travel range (mm)
sync_feedback_speed_multiplier: 5       # Speed correction % per feedback event
sync_feedback_boost_multiplier: 3       # Extra correction at buffer extremes
sync_feedback_extrude_threshold: 5      # Min extrude distance before feedback activates
sync_feedback_debug_log: 0             # 1 = enable debug logging for tuning


# -------------------------------------------------------------------------------------------------
# FLOWGUARD
#
# Monitors for sustained tension (tangle/jam at MMU) or compression (clog at nozzle).
# Works with the Slacker sensors to detect and respond to flow problems.
# -------------------------------------------------------------------------------------------------
flowguard_enabled: 1                    # Enable flow monitoring
flowguard_max_relief: 40                # Max filament displacement before error (mm)
flowguard_encoder_mode: 2               # 0=off, 1=encoder only, 2=feedback sensors
flowguard_encoder_max_motion: 20        # Max encoder motion before error


# -------------------------------------------------------------------------------------------------
# ENDLESS SPOOL
# Automatic switch to next available gate when current spool runs out.
# Requires either pre-gate sensors or gate sensors to detect runout.
# -------------------------------------------------------------------------------------------------
endless_spool_enabled: 0                # 0 = disabled (enable when pre-gate sensors are installed)
endless_spool_on_load: 0                # 0 = don't auto-switch on load failure
endless_spool_eject_gate: -1            # -1 = current gate


# -------------------------------------------------------------------------------------------------
# SPOOLMAN INTEGRATION (optional)
# -------------------------------------------------------------------------------------------------
spoolman_support: off                   # off | readonly | push | pull
pending_spool_id_timeout: 20            # Seconds before pending spool_id expires
t_macro_color: slicer                   # slicer | allgates | gatemap | off


# -------------------------------------------------------------------------------------------------
# PRINT STATISTICS
# -------------------------------------------------------------------------------------------------
console_stat_columns: unload, load, post_load, total
console_stat_rows: total, total_average, job, job_average, last
console_gate_stat: emoticon             # string | percentage | emoticon
console_always_output_full: 1           # 1 = always show full stats table


# -------------------------------------------------------------------------------------------------
# CALIBRATION & AUTOTUNE
#
# Happy Hare can auto-calibrate bowden length and per-gate rotation distance.
# This replaces the Fox Feeder MEASURE_BOWDEN macro.
# -------------------------------------------------------------------------------------------------
autocal_bowden_length: 1                # 1 = auto-calibrate bowden length
autotune_bowden_length: 1               # 1 = continuously fine-tune bowden length
skip_cal_rotation_distance: 0           # 0 = don't skip rotation distance calibration
autotune_rotation_distance: 1           # 1 = auto-tune per-gate rotation distance
skip_cal_encoder: 1                     # 1 = skip encoder calibration (no encoder on Fox Feeder)
autotune_encoder: 0                     # 0 = no encoder to autotune


# -------------------------------------------------------------------------------------------------
# MISCELLANEOUS
# -------------------------------------------------------------------------------------------------
timeout_pause: 72000                    # Idle timeout in seconds during MMU pause state
disable_heater: 600                     # Seconds before heater is disabled in pause state
default_extruder_temp: 200              # Default temp for swaps outside of a print
extruder_temp_variance: 2               # +/- degrees permissible variance when waiting for temp
mmu_activity_timeout: 900               # Idle timeout for MMU motors
startup_home_if_unloaded: 0             # 1 = home MMU on startup if unloaded
startup_reset_ttg_map: 0                # 1 = reset TTG map on startup
show_error_dialog: 1                    # 1 = show pop-up dialog on MMU error
preload_attempts: 5                     # Attempts to grab filament during preload
retry_tool_change_on_error: 0           # 1 = auto-retry failed tool change (can mask problems)
has_filament_buffer: 0                  # 0 = no rewinder/espooler (Slacker is passive, not a buffer)
bypass_autoload: 1                      # 1 = auto-load bypass if extruder sensor fitted
encoder_move_validation: 1              # 1 = encoder validates move distances
print_start_detection: 1                # 1 = auto-detect print start/end
extruder: extruder                      # Name of toolhead extruder
gcode_load_sequence: 0                  # 0 = use internal logic
gcode_unload_sequence: 0                # 0 = use internal logic


# -------------------------------------------------------------------------------------------------
# KLIPPER TUNING (important for CAN bus)
# -------------------------------------------------------------------------------------------------
update_trsync: 0                        # 1 = increase TRSYNC_TIMEOUT (may help with CAN bus)
canbus_comms_retries: 3                 # Retries for CAN bus comms failures (important!)
update_bit_max_time: 1                  # 1 = increase BIT_MAX_TIME for NeoPixels


# -------------------------------------------------------------------------------------------------
# MACRO OVERRIDES
# -------------------------------------------------------------------------------------------------
pause_macro: PAUSE
action_changed_macro: _MMU_ACTION_CHANGED
print_state_changed_macro: _MMU_PRINT_STATE_CHANGED
mmu_event_macro: _MMU_EVENT
pre_unload_macro: _MMU_PRE_UNLOAD
post_form_tip_macro: _MMU_POST_FORM_TIP
post_unload_macro: _MMU_POST_UNLOAD
pre_load_macro: _MMU_PRE_LOAD
post_load_macro: _MMU_POST_LOAD


# -------------------------------------------------------------------------------------------------
# RESET DEFAULTS (gate map defaults for 2-lane Fox Feeder)
# These are used by MMU_GATE_MAP RESET=1 and MMU_TTG_MAP RESET=1
# -------------------------------------------------------------------------------------------------
# Gate:                         #0      #1
#gate_status:                   1,      1
#gate_filament_name:            ,
#gate_material:                 PLA,    PLA
#gate_color:                    red,    blue
#gate_temperature:              210,    210
#gate_spool_id:                 -1,     -1
#gate_speed_override:           100,    100
#endless_spool_groups:          0,      0
#
# Tool:                         T0      T1
#tool_to_gate_map:              0,      1
