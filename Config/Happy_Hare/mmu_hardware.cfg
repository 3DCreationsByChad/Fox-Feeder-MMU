########################################################################################################################
# Happy Hare MMU Hardware Configuration for Fox Feeder MMU
#
# This file defines the physical hardware: steppers, drivers, sensors, and LEDs.
# Fox Feeder is a type-B MMU (VirtualSelector) with per-lane gear steppers,
# post-gear filament sensors, and Slacker-based sync feedback sensors.
#
# ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE ACTIVE
#
########################################################################################################################


# -------------------------------------------------------------------------------------------------
# MMU Machine Definition
# -------------------------------------------------------------------------------------------------
[mmu_machine]
num_gates: 2                            # 2-lane Fox Feeder (change to 4 for 4-lane)
mmu_vendor: BoxTurtle                   # Fox Feeder is type-B like BoxTurtle
mmu_version: 1.0                        # Fox Feeder version
homing_extruder: 1                      # Home filament into the extruder

# Type-B (VirtualSelector) settings - these are auto-derived but shown for clarity:
#selector_type: VirtualSelector         # No physical selector - each lane has its own motor
#variable_bowden_lengths: 0             # Same bowden length for all gates (can be 1 if different)
#variable_rotation_distances: 1         # Allow per-gate rotation distance calibration
#require_bowden_move: 1                 # Bowden move is part of load/unload sequence
#filament_always_gripped: 1             # Filament is always gripped by gear (no servo)


# -------------------------------------------------------------------------------------------------
# Gear Stepper 0 (Gate 0) - Base Stepper
#
# This is the "template" stepper. All additional gate steppers inherit
# common parameters (rotation_distance, gear_ratio, microsteps, etc.)
# from this definition automatically.
# -------------------------------------------------------------------------------------------------
[tmc2209 stepper_mmu_gear]
uart_pin: mmu:MMU_GEAR_UART
run_current: 0.8                        # Fox Feeder uses 0.8A run current
hold_current: 0.1
interpolate: True
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_mmu_gear]
step_pin: mmu:MMU_GEAR_STEP
dir_pin: mmu:MMU_GEAR_DIR              # Add ! prefix if direction is reversed
enable_pin: !mmu:MMU_GEAR_ENABLE
rotation_distance: 22                   # CW2-style: 22mm with 50:10 gear ratio
gear_ratio: 50:10
microsteps: 16
full_steps_per_rotation: 200


# -------------------------------------------------------------------------------------------------
# Gear Stepper 1 (Gate 1) - Additional Stepper
#
# Only step/dir/enable/uart pins need to be specified.
# All other params (rotation_distance, gear_ratio, etc.) are inherited
# from the base [stepper_mmu_gear] definition.
# -------------------------------------------------------------------------------------------------
[tmc2209 stepper_mmu_gear_1]
uart_pin: mmu:MMU_GEAR_UART_1
# run_current, hold_current, etc. inherited from base

[stepper_mmu_gear_1]
step_pin: mmu:MMU_GEAR_STEP_1
dir_pin: mmu:MMU_GEAR_DIR_1            # Add ! prefix if direction is reversed
enable_pin: !mmu:MMU_GEAR_ENABLE_1


# -------------------------------------------------------------------------------------------------
# 4-Lane Expansion
#
# Uncomment and configure these sections if expanding to 4 lanes:
#
# [tmc2209 stepper_mmu_gear_2]
# uart_pin: mmu:MMU_GEAR_UART_2
#
# [stepper_mmu_gear_2]
# step_pin: mmu:MMU_GEAR_STEP_2
# dir_pin: mmu:MMU_GEAR_DIR_2
# enable_pin: !mmu:MMU_GEAR_ENABLE_2
#
# [tmc2209 stepper_mmu_gear_3]
# uart_pin: mmu:MMU_GEAR_UART_3
#
# [stepper_mmu_gear_3]
# step_pin: mmu:MMU_GEAR_STEP_3
# dir_pin: mmu:MMU_GEAR_DIR_3
# enable_pin: !mmu:MMU_GEAR_ENABLE_3
# -------------------------------------------------------------------------------------------------


# -------------------------------------------------------------------------------------------------
# Selector Stepper (Not used on Fox Feeder - VirtualSelector type-B)
#
# Happy Hare v3.42 handles the selector internally for type-B MMUs.
# This section is commented out. Uncomment only for type-A linear selector designs.
# -------------------------------------------------------------------------------------------------
# [stepper_mmu_selector]
# step_pin: mmu:MMU_GEAR_STEP
# dir_pin: mmu:MMU_GEAR_DIR
# enable_pin: !mmu:MMU_GEAR_ENABLE
# rotation_distance: 8
# microsteps: 16
# full_steps_per_rotation: 200
# endstop_pin: tmc2209_stepper_mmu_gear:virtual_endstop


# -------------------------------------------------------------------------------------------------
# Servo (Not used on Fox Feeder - no servo hardware)
#
# Fox Feeder has no servo. This section is commented out as the installer
# does for BoxTurtle (HAS_SERVO=no). Uncomment only if you add a servo.
# -------------------------------------------------------------------------------------------------
# [mmu_servo selector_servo]
# pin: mmu:MMU_SEL_SERVO
# servo_up_angle: 30
# servo_move_angle: 60
# servo_down_angle: 140


# -------------------------------------------------------------------------------------------------
# Filament Sensors
#
# Fox Feeder sensors:
#   - Post-gear sensors (sensor_0, sensor_1): detect filament at each gate
#   - Slacker taut sensor: sync_feedback_tension (filament pulled tight)
#   - Slacker slack sensor: sync_feedback_compression (filament has slack)
#
# The Slacker sensors replace the need for an encoder on the Fox Feeder.
# Happy Hare uses them for real-time synchronized gear/extruder control.
# -------------------------------------------------------------------------------------------------
[mmu_sensors]

# Post-gear sensors (one per gate) - detect filament after the gear drive
# These are used as the gate homing endstop (gate_homing_endstop: mmu_gate)
post_gear_switch_pin_0: ^mmu:MMU_POST_GEAR_0
post_gear_switch_pin_1: ^!mmu:MMU_POST_GEAR_1
# post_gear_switch_pin_2:                       # Uncomment for 4-lane
# post_gear_switch_pin_3:                       # Uncomment for 4-lane

# Pre-gate sensors (optional, one per gate) - detect filament at spool entrance
# Useful for autoloading, runout detection, and endless spool
# Uncomment if you add pre-gate sensors to your Fox Feeder:
# pre_gate_switch_pin_0: ^mmu:MMU_PRE_GATE_0
# pre_gate_switch_pin_1: ^mmu:MMU_PRE_GATE_1

# Slacker sync feedback sensors (THE KEY FOX FEEDER FEATURE)
# These give Happy Hare real-time tension/compression feedback for
# synchronized gear/extruder operation during printing.
#
# Tension pin (taut):      triggered when filament is pulled tight
# Compression pin (slack): triggered when filament has too much slack
#
# The ^ prefix means pull-up, ! means active-low (inverted).
# Adjust to match your sensor wiring (normally open vs normally closed).
sync_feedback_tension_pin: ^!mmu:MMU_SYNC_FEEDBACK_TENSION
sync_feedback_compression_pin: ^!mmu:MMU_SYNC_FEEDBACK_COMPRESSION

# Toolhead sensors (optional, defined on printer MCU not MMU MCU)
# If you have a toolhead filament sensor (e.g., near extruder entry):
# extruder_switch_pin: ^<printer_mcu_pin>
# toolhead_switch_pin: ^<printer_mcu_pin>

# Encoder (not used on Fox Feeder - Slacker replaces this)
# If you add an encoder for additional accuracy:
# [mmu_encoder mmu_encoder]
# encoder_pin: ^mmu:MMU_ENCODER
# encoder_resolution: 0.67861
# desired_headroom: 5.0
# average_samples: 4
# flowrate_samples: 20


# -------------------------------------------------------------------------------------------------
# LEDs (Optional)
#
# Uncomment if you add a NeoPixel chain to your Fox Feeder.
# For a 2-lane setup, a minimum of 2 LEDs (one per gate) is useful.
# Happy Hare supports per-gate status colors (loading, unloading, errors, etc.)
# -------------------------------------------------------------------------------------------------
# [neopixel mmu_leds]
# pin: mmu:MMU_NEOPIXEL
# chain_count: 2                         # One per gate (increase for 4-lane)
# color_order: GRB
#
# [mmu_leds]
# exit_leds: mmu_leds (1-2)
# frame_rate: 24
