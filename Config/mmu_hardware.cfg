# ==================== Optional Hardware ====================
# Uncomment sections below as you add hardware. Set the corresponding
# use_* flag in mmu_parameters.cfg to enable macro integration.

# --- Toolhead Filament Sensor ---
# A filament switch at the toolhead entry (after extruder gears).
# Happy Hare uses this for reliable load/unload confirmation.
# This eliminates guesswork from step-counting during filament loads.
# HARDWARE: Any microswitch or optical sensor at toolhead entry.
# PIN: Set toolhead_sensor in pin aliases above.
#
#[filament_switch_sensor toolhead_sensor]
#switch_pin: ^pcu:toolhead_sensor
#pause_on_runout: False

# --- Filament Motion Encoder ---
# Monitors actual filament movement to detect clogs during printing.
# Happy Hare uses encoders extensively for movement verification.
# HARDWARE: A filament motion sensor (e.g., BTT SFS, TCRT5000-based).
# PIN: Set encoder in pin aliases above.
#
#[filament_motion_sensor encoder]
#switch_pin: ^pcu:encoder
#detection_length: 7.0
#extruder: extruder
#pause_on_runout: False
#runout_gcode:
#  _ENCODER_RUNOUT

# --- Neopixel Status LEDs ---
# Per-lane RGB status indication. Happy Hare supports extensive LED
# feedback for gate status. Colors indicate lane state:
#   Green = filament loaded and ready
#   Blue = active (synced with extruder)
#   Red = error or empty
#   Off = no filament
# HARDWARE: WS2812B / Neopixel strip, 1 LED per lane.
# PIN: Set led_data in pin aliases above.
#
#[neopixel mmu_leds]
#pin: pcu:led_data
#chain_count: 2        # One per lane. Set to 4 for 4-lane config.
#color_order: GRB
#initial_RED: 0.0
#initial_GREEN: 0.0
#initial_BLUE: 0.0
