#######################################################################
# Fox Feeder MMU - Hardware Configuration
#######################################################################
#
# This file defines all physical hardware: MCU, pin aliases, stepper
# motors, TMC drivers, filament sensors, and optional components
# (encoder, toolhead sensor, LEDs).
#
# Modeled after Happy Hare's mmu_hardware.cfg approach, adapted for
# the Fox Feeder's per-lane stepper architecture (no selector/servo).
#
#######################################################################


# ==================== MCU ====================

[mcu pcu]
canbus_uuid: 2c180b4d19b3


# ==================== Pin Aliases ====================
# Organize pins by function for easy identification.
# To add lanes 2-3 for a 4-lane config, uncomment the lane2/lane3
# aliases and add corresponding stepper/sensor sections below.

[board_pins pcu_alias]
mcu: pcu
aliases:
  ## Slacker sensor (shared tension/slack monitoring)
  slacker_taut=PA3,
  slacker_slack=PA4,
  ## Lane 0
  lane0_sensor=PB9,
  lane0_step=PB15,
  lane0_dir=PB14,
  lane0_enable=PA8,
  lane0_uart=PA10,
  ## Lane 1
  lane1_sensor=PB8,
  lane1_step=PD2,
  lane1_dir=PB13,
  lane1_enable=PD1,
  lane1_uart=PC7,
  ## Lane 2 (uncomment for 4-lane config)
  #lane2_sensor=<pin>,
  #lane2_step=<pin>,
  #lane2_dir=<pin>,
  #lane2_enable=<pin>,
  #lane2_uart=<pin>,
  ## Lane 3 (uncomment for 4-lane config)
  #lane3_sensor=<pin>,
  #lane3_step=<pin>,
  #lane3_dir=<pin>,
  #lane3_enable=<pin>,
  #lane3_uart=<pin>,
  ## Optional: Toolhead filament sensor
  ## A switch at the toolhead entry confirms filament arrival/departure.
  ## Dramatically improves load/unload reliability vs. step-counting.
  #toolhead_sensor=<pin>,
  ## Optional: Filament encoder
  ## Detects clog conditions by monitoring filament motion during prints.
  #encoder=<pin>,
  ## Optional: Neopixel LED data pin
  ## Per-lane status LEDs for visual feedback.
  #led_data=<pin>,


# ==================== Gear Steppers ====================
# One Nema14 + BMG gear set per lane. Each is an extruder_stepper that
# can sync to the main extruder for printing or isolate for independent
# filament moves via FORCE_MOVE.

# --- Lane 0 ---
[extruder_stepper stepper_0]
extruder:
step_pin: pcu:lane0_step
dir_pin: pcu:lane0_dir
enable_pin: !pcu:lane0_enable
microsteps: 16
rotation_distance: 22
gear_ratio: 50:10  # BMG / CW2 gear ratio
full_steps_per_rotation: 200

[tmc2209 extruder_stepper stepper_0]
uart_pin: pcu:lane0_uart
run_current: 0.8
hold_current: 0.1
stealthchop_threshold: 0
interpolate: True

# --- Lane 1 ---
[extruder_stepper stepper_1]
extruder:
step_pin: pcu:lane1_step
dir_pin: pcu:lane1_dir
enable_pin: !pcu:lane1_enable
microsteps: 16
rotation_distance: 22
gear_ratio: 50:10  # BMG / CW2 gear ratio
full_steps_per_rotation: 200

[tmc2209 extruder_stepper stepper_1]
uart_pin: pcu:lane1_uart
run_current: 0.8
hold_current: 0.1
stealthchop_threshold: 0
interpolate: True

