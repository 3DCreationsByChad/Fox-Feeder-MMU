# ==================== Filament Sensors ====================

# --- Slacker Sensors (Tension Monitoring) ---
# These shared sensors detect filament tension (taut) and slack in the
# bowden path. The Slacker mechanism is analogous to Happy Hare's
# "sync feedback" sensors. They trigger corrective stepper moves to
# maintain proper filament tension during printing.

[filament_switch_sensor slacker_taut]
switch_pin: ^!pcu:slacker_taut
pause_on_runout: False
runout_gcode:
  {% set lane = printer["gcode_macro _FILAMENT_VARS"].activelane %}
  RESPOND MSG="Lane {lane}: TAUT"
  FORCE_MOVE STEPPER="extruder_stepper stepper_{lane}" DISTANCE=6 VELOCITY=50 ACCEL=600

[filament_switch_sensor slacker_slack]
switch_pin: ^!pcu:slacker_slack
pause_on_runout: False
runout_gcode:
  {% set lane = printer["gcode_macro _FILAMENT_VARS"].activelane %}
  RESPOND MSG="Lane {lane}: SLACK"
  FORCE_MOVE STEPPER="extruder_stepper stepper_{lane}" DISTANCE=-6 VELOCITY=50 ACCEL=600

# --- Per-Lane Filament Sensors ---
# Each lane has a sensor to detect filament presence at the gear.
# Equivalent to Happy Hare's "pre-gate" sensors.

[filament_switch_sensor lane_0_sensor]
switch_pin: ^pcu:lane0_sensor
pause_on_runout: False

[filament_switch_sensor lane_1_sensor]
switch_pin: ^pcu:lane1_sensor
pause_on_runout: False

